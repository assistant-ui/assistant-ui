<style>
.kb{font-family:var(--font-sans);color:var(--color-text);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px}
.kb-col{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:8px;display:flex;flex-direction:column;min-height:180px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.kb-col.over{outline-color:var(--color-accent)}
.kb-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;margin:2px 4px 8px}
.kb-n{font-size:12px;color:var(--color-text-muted);font-weight:500}
.kb-list{flex:1;display:flex;flex-direction:column;gap:6px}
.kb-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:8px;font-size:13px;cursor:grab;display:flex;justify-content:space-between;gap:6px;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kb-card.drag{opacity:.4}
.kb-card button{border:none;background:none;color:var(--color-text-muted);cursor:pointer;font-size:14px;line-height:1;padding:0}
.kb-card button:hover{color:var(--color-text)}
.kb-add{margin-top:8px;display:flex;gap:4px}
.kb-add input{flex:1;min-width:0;font:inherit;font-size:12px;padding:5px 6px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:transparent;color:var(--color-text)}
.kb-add button{font:inherit;font-size:12px;border:none;border-radius:var(--radius-md);background:var(--color-accent);color:#fff;padding:0 8px;cursor:pointer}
@media(max-width:440px){.kb{grid-template-columns:1fr}}
</style>
<div class="kb" id="kb"></div>
<script>
(()=>{
const data={"To do":["Write project brief","Design landing page","Set up analytics"],"Doing":["Build login flow","Review pull requests"],"Done":["Choose tech stack","Create repo"]};
const kb=document.getElementById('kb');let dragged=null;
function card(text){
 const c=document.createElement('div');c.className='kb-card';c.draggable=true;
 const s=document.createElement('span');s.textContent=text;
 const x=document.createElement('button');x.textContent='×';x.title='Delete';x.setAttribute('aria-label','Delete card');
 x.onclick=()=>{c.remove();counts()};
 c.append(s,x);
 c.addEventListener('dragstart',e=>{dragged=c;c.classList.add('drag');e.dataTransfer.effectAllowed='move'});
 c.addEventListener('dragend',()=>{c.classList.remove('drag');dragged=null;counts()});
 return c;
}
function counts(){kb.querySelectorAll('.kb-col').forEach(col=>col.querySelector('.kb-n').textContent=col.querySelectorAll('.kb-card').length)}
function afterEl(list,y){
 return [...list.querySelectorAll('.kb-card:not(.drag)')].reduce((best,el)=>{const b=el.getBoundingClientRect();const o=y-b.top-b.height/2;return o<0&&o>best.o?{o,el}:best},{o:-Infinity}).el;
}
for(const [name,items] of Object.entries(data)){
 const col=document.createElement('div');col.className='kb-col';
 col.innerHTML='<div class="kb-h"><span></span><span class="kb-n"></span></div><div class="kb-list"></div><form class="kb-add"><input placeholder="Add a card…"><button>Add</button></form>';
 col.querySelector('.kb-h span').textContent=name;
 const list=col.querySelector('.kb-list');
 items.forEach(t=>list.append(card(t)));
 col.addEventListener('dragover',e=>{if(!dragged)return;e.preventDefault();col.classList.add('over');const a=afterEl(list,e.clientY);a?list.insertBefore(dragged,a):list.append(dragged)});
 col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});
 col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');counts()});
 col.querySelector('form').onsubmit=e=>{e.preventDefault();const i=e.target.querySelector('input');const v=i.value.trim();if(v){list.append(card(v));i.value='';counts()}};
 kb.append(col);
}
counts();
})();
</script>
```

Drag cards between columns or reorder them within a column. You can add new cards with the input at the bottom of each column, and remove any card with the × button.
