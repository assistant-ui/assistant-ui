<!doctype html>
<html><head><meta charset="utf-8"><title>overflow</title>
<style>html{overflow-y:scroll}body{margin:0;overflow-x:auto}table{border-collapse:collapse}td{border:1px solid #999;padding:4px 8px;white-space:nowrap}</style></head>
<body><table data-probe="table"><tr><td>A wide table cell with a lot of text</td><td>Another wide cell</td><td>And a third wide cell</td><td>Fourth</td></tr></table></body></html>
