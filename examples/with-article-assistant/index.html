<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Article Assistant</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Before the app's CSS loads. In a shell, appOS's sandbox puts the
         shell's "dark" class on <html> before the first paint; outside
         one, the system decides. (Not light-dark(): Vite's build turns it
         into a media query.) */
      html {
        background: #ffffff;
      }
      html.dark {
        background: #09090b;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-appos-color-scheme]) {
          background: #09090b;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
