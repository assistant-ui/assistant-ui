ci:
  collect:
    startServerCommand: next start -p 3332
    # The home page, a typical docs page, and the playground, which has the
    # slowest largest contentful paint of the pages measured.
    url:
      - http://localhost:3332/
      - http://localhost:3332/docs/runtimes/ai-sdk/overview
      - http://localhost:3332/playground
    numberOfRuns: 3
  # Floors come from 12 local Lighthouse 13.5.0 runs per page. Accessibility,
  # best-practices, and SEO scores were identical in every run, so their floors
  # sit 0.01 under them. Largest contentful paint is bimodal on the home and docs
  # pages, so each performance floor sits under that page's slowest single run
  # (home 0.56, docs page and playground 0.61).
  assert:
    assertMatrix:
      - matchingUrlPattern: "localhost:3332/$"
        assertions:
          categories:performance: [error, { minScore: 0.55, aggregationMethod: median }]
          categories:accessibility: [error, { minScore: 0.76, aggregationMethod: median }]
          categories:best-practices: [error, { minScore: 0.91, aggregationMethod: median }]
          categories:seo: [error, { minScore: 0.99, aggregationMethod: median }]
      - matchingUrlPattern: /docs/runtimes/ai-sdk/overview$
        assertions:
          categories:performance: [error, { minScore: 0.6, aggregationMethod: median }]
          categories:accessibility: [error, { minScore: 0.9, aggregationMethod: median }]
          categories:best-practices: [error, { minScore: 0.91, aggregationMethod: median }]
          categories:seo: [error, { minScore: 0.99, aggregationMethod: median }]
      - matchingUrlPattern: /playground$
        assertions:
          categories:performance: [error, { minScore: 0.6, aggregationMethod: median }]
          categories:accessibility: [error, { minScore: 0.87, aggregationMethod: median }]
          categories:best-practices: [error, { minScore: 0.91, aggregationMethod: median }]
          categories:seo: [error, { minScore: 0.99, aggregationMethod: median }]
  upload:
    target: filesystem
    outputDir: .lighthouseci/reports
