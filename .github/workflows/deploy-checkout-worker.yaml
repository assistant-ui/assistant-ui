name: Deploy Checkout Worker

# The worker and the setup-agent CLI share a wire protocol, so the worker deploys
# only from a commit whose setup-agent is already on npm: after a release that
# publishes setup-agent (npm-publish.yaml calls this workflow), or on a push that
# leaves setup-agent released.
on:
  push:
    branches:
      - main
    paths:
      - apps/checkout-worker/**
  workflow_call:
    inputs:
      releaseSha:
        description: "Release commit SHA to deploy"
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      releaseSha:
        description: "Commit SHA to deploy (defaults to latest default-branch commit)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.deploy-sha.outputs.value }}
      deploy: ${{ steps.released.outputs.deploy }}
    steps:
      - name: Resolve deploy commit SHA
        id: deploy-sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        env:
          REQUESTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.releaseSha }}
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch;
            let deploySha = (process.env.REQUESTED_SHA ?? "").trim().toLowerCase();

            if (!deploySha) {
              const ref = await github.rest.git.getRef({
                ...context.repo,
                ref: `heads/${defaultBranch}`,
              });
              deploySha = ref.data.object.sha;
            }

            if (!/^[0-9a-f]{40}$/.test(deploySha)) {
              core.setFailed(
                `releaseSha must be a full 40-character commit SHA: ${deploySha}`,
              );
              return;
            }

            const { repository } = await github.graphql(
              `query ($owner: String!, $repo: String!, $branch: String!, $sha: String!) {
                repository(owner: $owner, name: $repo) {
                  ref(qualifiedName: $branch) {
                    compare(headRef: $sha) {
                      status
                    }
                  }
                }
              }`,
              { ...context.repo, branch: `refs/heads/${defaultBranch}`, sha: deploySha },
            );
            if (!["BEHIND", "IDENTICAL"].includes(repository.ref.compare.status)) {
              core.setFailed(
                `${deploySha} is not on ${defaultBranch}; refusing to deploy`,
              );
              return;
            }

            core.setOutput("value", deploySha);

      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ steps.deploy-sha.outputs.value }}
          persist-credentials: false

      - name: Check setup-agent is released
        id: released
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        env:
          DEPLOY_SHA: ${{ steps.deploy-sha.outputs.value }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const deploySha = process.env.DEPLOY_SHA;
            const isPush = process.env.IS_PUSH === "true";

            // A push leaves an unreleased setup-agent to the release that
            // publishes it; a release or manual deploy fails instead.
            const holdBack = (reason) => {
              if (isPush) {
                core.notice(`Skipping the deploy of ${deploySha}: ${reason}`);
                core.setOutput("deploy", "false");
              } else {
                core.setFailed(`Refusing to deploy ${deploySha}: ${reason}`);
              }
            };

            const pendingSetupAgent = fs
              .readdirSync(".changeset")
              .filter((file) => file.endsWith(".md") && file !== "README.md")
              .filter((file) => {
                const source = fs.readFileSync(path.join(".changeset", file), "utf8");
                const frontmatter = /^---\r?\n([\s\S]*?)\r?\n---/.exec(source)?.[1] ?? "";
                return /^\s*["']?setup-agent["']?\s*:/m.test(frontmatter);
              });
            if (pendingSetupAgent.length > 0) {
              holdBack(
                `pending setup-agent changesets (${pendingSetupAgent.join(", ")}) mean the worker may need a CLI that is not on npm yet; the worker deploys after that release`,
              );
              return;
            }

            const { version } = JSON.parse(
              fs.readFileSync("packages/setup-agent/package.json", "utf8"),
            );
            const lookup = async () => {
              try {
                const response = await fetch(
                  `https://registry.npmjs.org/setup-agent/${version}`,
                  { signal: AbortSignal.timeout(15_000) },
                );
                return `HTTP ${response.status}`;
              } catch (error) {
                return error.message;
              }
            };

            // A release reaches the registry a few minutes after publish.
            const deadline = Date.now() + (isPush ? 0 : 15 * 60_000);
            let result = await lookup();
            while (result !== "HTTP 200" && Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 10_000));
              result = await lookup();
            }

            if (result !== "HTTP 200") {
              holdBack(
                `setup-agent@${version} is not on npm (${result}); the worker deploys after that release`,
              );
              return;
            }

            core.setOutput("deploy", "true");

  deploy:
    name: Deploy
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: checkout-worker
      url: https://setup.assistant-ui.com
    # A literal group, because inside a workflow_call github.workflow names the
    # caller, so a release deploy and a push deploy would not exclude each other.
    concurrency:
      group: deploy-checkout-worker
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          install: false
          # No cache (`cache` defaults to false) - this job holds the Cloudflare deploy token

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm turbo build --filter='checkout-worker^...'

      - name: Dry run
        working-directory: apps/checkout-worker
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/checkout-worker"

      - name: Deploy to Cloudflare
        working-directory: apps/checkout-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Recovery guidance
        if: failure()
        run: |
          echo "::error::The checkout worker deploy failed for ${DEPLOY_SHA}, so setup.assistant-ui.com still serves the previous version."
          echo "::error::Rerun this job, or run Deploy Checkout Worker via workflow_dispatch with releaseSha=${DEPLOY_SHA}."
