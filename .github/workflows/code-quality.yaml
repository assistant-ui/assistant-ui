name: Code Quality

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "api-surface/**"
      - "apps/**"
      - "examples/**"
      - "templates/**"
      - "scripts/generate-api-surface.mjs"
      - "scripts/autofix-install.mjs"
      - "scripts/autofix-install.test.mjs"
      - "scripts/update-api-surface.mjs"
      - "scripts/update-api-surface.test.mjs"
      - "scripts/lib/**"
      - "scripts/check-api-surface.mjs"
      - "scripts/check-built-declarations.mjs"
      - "scripts/check-built-declarations.test.mjs"
      - "scripts/check-distribution-barrels.mjs"
      - "scripts/check-distribution-barrels.test.mjs"
      - "scripts/check-workspace-ranges.mjs"
      - "scripts/check-workspace-ranges.test.mjs"
      - "scripts/source-mapped-tsconfigs.test.mjs"
      - "scripts/check-skills-commit.mjs"
      - "scripts/check-skills-commit.test.mjs"
      - "scripts/deploy-examples-changes.mjs"
      - "scripts/deploy-examples-changes.test.mjs"
      - "scripts/api-reference-inputs.mjs"
      - "scripts/api-reference-inputs.test.mjs"
      - "scripts/*example-bundle*"
      - "scripts/app-build-inputs.mjs"
      - "scripts/app-build-inputs.test.mjs"
      - "scripts/package-build-inputs.mjs"
      - "scripts/package-build-inputs.test.mjs"
      - "scripts/turbo-redis-env.test.mjs"
      - "scripts/prepare-ci-base.mjs"
      - "scripts/prepare-ci-base.test.mjs"
      - "scripts/coverage-summary.mjs"
      - "scripts/coverage-summary.test.mjs"
      - ".github/workflows/deploy-examples.yaml"
      - ".github/workflows/expo-native-bundle.yaml"
      - "scripts/typecheck.sh"
      - "scripts/ci-has-tasks.mjs"
      - "scripts/ci-has-tasks.test.mjs"
      - "scripts/test-redis-inputs.mjs"
      - "scripts/test-redis-inputs.test.mjs"
      - "scripts/run-ci-tests.mjs"
      - "scripts/run-ci-tests.test.mjs"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/code-quality.yaml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "api-surface/**"
      - "apps/**"
      - "examples/**"
      - "templates/**"
      - "scripts/generate-api-surface.mjs"
      - "scripts/autofix-install.mjs"
      - "scripts/autofix-install.test.mjs"
      - "scripts/update-api-surface.mjs"
      - "scripts/update-api-surface.test.mjs"
      - "scripts/lib/**"
      - "scripts/check-api-surface.mjs"
      - "scripts/check-built-declarations.mjs"
      - "scripts/check-built-declarations.test.mjs"
      - "scripts/check-distribution-barrels.mjs"
      - "scripts/check-distribution-barrels.test.mjs"
      - "scripts/check-workspace-ranges.mjs"
      - "scripts/check-workspace-ranges.test.mjs"
      - "scripts/source-mapped-tsconfigs.test.mjs"
      - "scripts/check-skills-commit.mjs"
      - "scripts/check-skills-commit.test.mjs"
      - "scripts/deploy-examples-changes.mjs"
      - "scripts/deploy-examples-changes.test.mjs"
      - "scripts/api-reference-inputs.mjs"
      - "scripts/api-reference-inputs.test.mjs"
      - "scripts/*example-bundle*"
      - "scripts/app-build-inputs.mjs"
      - "scripts/app-build-inputs.test.mjs"
      - "scripts/package-build-inputs.mjs"
      - "scripts/package-build-inputs.test.mjs"
      - "scripts/turbo-redis-env.test.mjs"
      - "scripts/prepare-ci-base.mjs"
      - "scripts/prepare-ci-base.test.mjs"
      - "scripts/coverage-summary.mjs"
      - "scripts/coverage-summary.test.mjs"
      - ".github/workflows/deploy-examples.yaml"
      - ".github/workflows/expo-native-bundle.yaml"
      - "scripts/typecheck.sh"
      - "scripts/ci-has-tasks.mjs"
      - "scripts/ci-has-tasks.test.mjs"
      - "scripts/test-redis-inputs.mjs"
      - "scripts/test-redis-inputs.test.mjs"
      - "scripts/run-ci-tests.mjs"
      - "scripts/run-ci-tests.test.mjs"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/code-quality.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Oxlint + Oxfmt
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @assistant-ui/x-buildutils --ignore-scripts

      - name: Run oxlint + oxfmt
        run: pnpm lint

      - name: Check resource memoization (React Compiler)
        run: pnpm check:resource-memo

  workspace-ranges:
    name: Workspace Ranges
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          install: false

      - name: Test the shared script helpers
        run: node --test scripts/lib/*.test.mjs

      - name: Test the workspace range checker
        run: node --test scripts/check-workspace-ranges.test.mjs

      - name: Verify published packages publish caret workspace ranges
        run: node scripts/check-workspace-ranges.mjs

  skills-commit:
    name: Skills Commit Pins
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          install: false

      - name: Test the skills commit checker
        run: node --test scripts/check-skills-commit.test.mjs

      - name: Verify the skills commit is pinned consistently
        run: node scripts/check-skills-commit.mjs

  build:
    name: Build Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Test CI comparison base preparation
        run: node --test scripts/prepare-ci-base.test.mjs

      - name: Detect package build inputs
        id: package_build_inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=HEAD^1
          else
            BASE="${{ github.event.before }}"
          fi
          if git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            run=$(git diff --name-only --no-renames -z "$BASE" HEAD | node scripts/package-build-inputs.mjs)
          else
            run=true
            BASE=""
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and node.js
        if: steps.package_build_inputs.outputs.run == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        if: steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && git diff --quiet "$BASE" HEAD -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            packages/x-buildutils; then
            plan=$(node scripts/update-api-surface.mjs --base "$BASE" --print-filters)
            mapfile -t filters < <(jq -r 'if length == 0 then "--filter=./packages/*..." else .[] | "--filter=\(.)..." end' <<< "$plan")
            pnpm install --frozen-lockfile \
              --filter="." \
              --filter="@assistant-ui/api-surface" \
              --filter="@assistant-ui/react-devtools..." \
              --filter="@assistant-ui/x-buildutils..." \
              --filter="@assistant-ui/x-performance" \
              "${filters[@]}" \
              --filter="!./apps/*" \
              --filter="!./examples/*" \
              --filter="!./templates/*"
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build packages
        if: steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm api-surface -- --base="$BASE" --build-only

      - name: Check API surface
        if: steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
        run: pnpm run api-surface:check -- --skip-build --base="$BASE"

      - name: Check distribution barrels
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run distributions:check

      - name: Check built declarations
        if: steps.package_build_inputs.outputs.run == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm run declarations:check -- --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm run declarations:check -- --filter="...[HEAD^1]"
          fi

      - name: Test built declaration checker
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run declarations:test

      - name: Test the distribution barrel checker
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run distributions:test

      - name: Test the deploy examples planner
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run deploy-examples:test

      - name: Test API surface generator
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run api-surface:test

      - name: Test API reference input detector
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run api-reference-inputs:test

      - name: Test package build input detector
        run: node --test scripts/package-build-inputs.test.mjs

      - name: Test Redis build cache isolation
        if: steps.package_build_inputs.outputs.run == 'true'
        run: node --test scripts/turbo-redis-env.test.mjs

      # The pull_request checkout is the merge commit, so HEAD^1 is the base it merges into.
      - name: Measure bundle sizes against the base
        if: github.event_name == 'pull_request' && steps.package_build_inputs.outputs.run == 'true'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          set -euo pipefail
          node packages/x-performance/bin/aui-perf.mjs size --ref HEAD^1 --report "$RUNNER_TEMP/size.md"
          if [ -f "$RUNNER_TEMP/size.md" ]; then cat "$RUNNER_TEMP/size.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Post the size report as a sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_MARKER: "<!-- aui-size-report -->"
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$REPORT_MARKER\"))) | .id" | sed -n '1p')
          if [ -f "$RUNNER_TEMP/size.md" ] && [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" --method PATCH -F body=@"$RUNNER_TEMP/size.md"
          elif [ -f "$RUNNER_TEMP/size.md" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --method POST -F body=@"$RUNNER_TEMP/size.md"
          elif [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" --method DELETE
          fi

  build-apps:
    name: Build Changed Apps
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Detect app build inputs
        id: app_build_inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=HEAD^1
          else
            BASE="${{ github.event.before }}"
          fi
          if git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            run=$(git diff --name-only --no-renames -z "$BASE" HEAD | node scripts/app-build-inputs.mjs)
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Test app build input detector
        run: node --test scripts/app-build-inputs.test.mjs

      - name: Test CI task planner
        run: node --test scripts/ci-has-tasks.test.mjs

      - name: Test source-mapped tsconfig paths
        run: node --test scripts/source-mapped-tsconfigs.test.mjs

      - name: Setup pnpm and node.js
        if: steps.app_build_inputs.outputs.run == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        if: steps.app_build_inputs.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # apps/docs is excluded: its build belongs to the Vercel deployment.
      # Examples are demos, so a package change does not rebuild them; an example is built only
      # when its own files change, and deploy-examples builds the deployed ones on main.
      - name: Build apps
        if: steps.app_build_inputs.outputs.run == 'true'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: Build apps and templates affected by changes compared to base branch
            pnpm turbo build --filter="...[origin/${{ github.base_ref }}]" --filter="!./packages/*" --filter="!./api-surface" --filter="!@assistant-ui/docs" --filter="!./examples/*"
            pnpm turbo build --filter="{./examples/*}[origin/${{ github.base_ref }}]"
          else
            # Push to main: Build apps and templates affected by the last commit
            pnpm turbo build --filter="...[HEAD^1]" --filter="!./packages/*" --filter="!./api-surface" --filter="!@assistant-ui/docs" --filter="!./examples/*"
            pnpm turbo build --filter="{./examples/*}[HEAD^1]"
          fi

      - name: Verify standalone example bundle contracts
        if: steps.app_build_inputs.outputs.run == 'true'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm test:bundles

  api-reference-drift:
    name: API Reference Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Detect API reference inputs
        id: api_ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^1"
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null; then
            echo "Unable to resolve API reference diff base: $BASE"
            exit 1
          fi
          run="$(git diff --name-only --no-renames -z "$BASE" | node scripts/api-reference-inputs.mjs)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and node.js
        if: steps.api_ref.outputs.run == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        if: steps.api_ref.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --filter . --filter="@assistant-ui/docs..." --filter="@assistant-ui/eve..."

      - name: Generate API reference (strict)
        if: steps.api_ref.outputs.run == 'true'
        run: pnpm -C apps/docs generate:api-reference -- --strict

      - name: Fail on API reference drift
        if: steps.api_ref.outputs.run == 'true'
        run: |
          if git status --porcelain -- 'apps/docs/content/docs/(reference)/api-reference' | grep -q .; then
            echo "API reference pages are stale. JSDoc or export changes are not reflected in apps/docs/content/docs/(reference)/api-reference."
            echo "Run \`pnpm -C apps/docs generate:api-reference\` and commit the result."
            echo "Durable hand-written prose belongs in source JSDoc or api-manual slots."
            git status --porcelain -- 'apps/docs/content/docs/(reference)/api-reference'
            git diff -- 'apps/docs/content/docs/(reference)/api-reference'
            exit 1
          fi

  test:
    name: Test Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    # Note: No dependency on 'build' job - Turbo handles test->build dependencies internally via dependsOn
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE=HEAD^1
          fi
          if git diff --quiet "$BASE" HEAD -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            packages/x-buildutils; then
            pnpm install --frozen-lockfile --filter . --filter="@assistant-ui/react-devtools..." --filter="@assistant-ui/ai-sdk..." --filter="@assistant-ui/core..." --filter="@assistant-ui/store..." --filter="...[$BASE]..." --filter="!@assistant-ui/api-surface"
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo build --filter="...[origin/${{ github.base_ref }}]" --filter="!./apps/*" --filter="!./examples/*" --filter="!./templates/*"
          else
            pnpm turbo build --filter="...[HEAD^1]" --filter="!./apps/*" --filter="!./examples/*" --filter="!./templates/*"
          fi

      - name: Test Redis service selection
        run: node --test scripts/test-redis-inputs.test.mjs

      - name: Select Redis test service
        id: redis
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE=HEAD^1
          fi
          run=$(pnpm exec turbo run test --dry=json --filter="...[$BASE]" | node scripts/test-redis-inputs.mjs)
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Start Redis for selected tests
        if: steps.redis.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run --detach --name aui-test-redis --publish 6379:6379 redis:8-alpine
          for attempt in {1..50}; do
            if docker exec aui-test-redis redis-cli ping | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs aui-test-redis
          exit 1

      - name: Test CI scheduling
        run: node --test scripts/run-ci-tests.test.mjs

      - name: Run tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: Test packages changed compared to base branch
            node scripts/run-ci-tests.mjs --filter="...[origin/${{ github.base_ref }}]"
          else
            # Push to main: Test packages changed in last commit
            node scripts/run-ci-tests.mjs --filter="...[HEAD^1]"
          fi

      - name: Run React Compiler tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm test:react-compiler

      - name: Stop Redis
        if: always() && steps.redis.outputs.run == 'true'
        run: |
          if docker inspect aui-test-redis > /dev/null 2>&1; then
            docker rm --force aui-test-redis
          fi

  coverage:
    name: Coverage of Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE=HEAD^1
          fi
          if git diff --quiet "$BASE" HEAD -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            packages/x-buildutils; then
            pnpm install --frozen-lockfile --filter . --filter="@assistant-ui/react-devtools..." --filter="@assistant-ui/ai-sdk..." --filter="@assistant-ui/core..." --filter="@assistant-ui/store..." --filter="...[$BASE]..."
          else
            pnpm install --frozen-lockfile
          fi

      - name: Test the coverage summary
        run: pnpm run coverage:test

      - name: Build packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo build --filter="...[origin/${{ github.base_ref }}]" --filter="!./apps/*" --filter="!./examples/*" --filter="!./templates/*"
          else
            pnpm turbo build --filter="...[HEAD^1]" --filter="!./apps/*" --filter="!./examples/*" --filter="!./templates/*"
          fi

      - name: Test Redis service selection
        run: node --test scripts/test-redis-inputs.test.mjs

      - name: Select Redis coverage service
        id: redis
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE=HEAD^1
          fi
          run=$(pnpm exec turbo run test:coverage --dry=json --filter="...[$BASE]" | node scripts/test-redis-inputs.mjs)
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Start Redis for selected coverage tests
        if: steps.redis.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run --detach --name aui-coverage-redis --publish 6379:6379 redis:8-alpine
          for attempt in {1..50}; do
            if docker exec aui-coverage-redis redis-cli ping | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs aui-coverage-redis
          exit 1

      # Concurrency 1 for the same reason as the Test job; coverage instrumentation slows each file further.
      - name: Run tests with coverage
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILTER="...[origin/${{ github.base_ref }}]"
          else
            FILTER="...[HEAD^1]"
          fi
          pnpm turbo test:coverage --concurrency=1 --filter="$FILTER"

      - name: Write the coverage summary
        if: always()
        run: pnpm run coverage:summary -- --report "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: |
            packages/*/coverage/
            apps/*/coverage/
            examples/*/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Redis
        if: always() && steps.redis.outputs.run == 'true'
        run: |
          if docker inspect aui-coverage-redis > /dev/null 2>&1; then
            docker rm --force aui-coverage-redis
          fi

  typecheck:
    name: Typecheck Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^1' }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Detect typecheck tasks
        id: tasks
        run: |
          set -euo pipefail
          run=$(node scripts/ci-has-tasks.mjs "$CI_BASE" typecheck --filter="...[$CI_BASE]")
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.tasks.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE=HEAD^1
          fi
          if git diff --quiet "$BASE" HEAD -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            packages/x-buildutils; then
            pnpm install --frozen-lockfile --filter . --filter="@assistant-ui/react-devtools..." --filter="...[$BASE]..." --filter="!@assistant-ui/api-surface"
          else
            pnpm install --frozen-lockfile
          fi

      - name: Typecheck
        if: steps.tasks.outputs.run == 'true'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/typecheck.sh --continue --filter="...[origin/${{ github.base_ref }}]"
          else
            bash scripts/typecheck.sh --continue --filter="...[HEAD^1]"
          fi
