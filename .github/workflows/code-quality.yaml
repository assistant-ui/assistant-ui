name: Code Quality

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "api-surface/**"
      - "apps/**"
      - "examples/**"
      - "templates/**"
      - "scripts/generate-api-surface.mjs"
      - "scripts/autofix-install.mjs"
      - "scripts/autofix-install.test.mjs"
      - "scripts/update-api-surface.mjs"
      - "scripts/update-api-surface.test.mjs"
      - "scripts/lib/**"
      - "scripts/check-api-surface.mjs"
      - "scripts/check-built-declarations.mjs"
      - "scripts/check-built-declarations.test.mjs"
      - "scripts/check-distribution-barrels.mjs"
      - "scripts/check-distribution-barrels.test.mjs"
      - "scripts/check-experimental.mjs"
      - "scripts/check-experimental.test.mjs"
      - "scripts/check-workspace-ranges.mjs"
      - "scripts/check-workspace-ranges.test.mjs"
      - "scripts/source-mapped-tsconfigs.test.mjs"
      - "scripts/check-skills-commit.mjs"
      - "scripts/check-skills-commit.test.mjs"
      - "scripts/prune-worktrees.mjs"
      - "scripts/prune-worktrees.test.mjs"
      - "scripts/deploy-examples-changes.mjs"
      - "scripts/deploy-examples-changes.test.mjs"
      - "scripts/api-reference-inputs.mjs"
      - "scripts/api-reference-inputs.test.mjs"
      - "scripts/*example-bundle*"
      - "scripts/app-build-inputs.mjs"
      - "scripts/app-build-inputs.test.mjs"
      - "scripts/package-build-inputs.mjs"
      - "scripts/package-build-inputs.test.mjs"
      - "scripts/turbo-redis-env.test.mjs"
      - "scripts/prepare-ci-base.mjs"
      - "scripts/prepare-ci-base.test.mjs"
      - ".github/workflows/deploy-examples.yaml"
      - ".github/workflows/expo-native-bundle.yaml"
      - "scripts/typecheck.sh"
      - "scripts/ci-has-tasks.mjs"
      - "scripts/ci-has-tasks.test.mjs"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/code-quality.yaml"
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Oxlint + Oxfmt
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @assistant-ui/x-buildutils --ignore-scripts

      - name: Run oxlint + oxfmt
        run: pnpm lint

      - name: Check resource memoization (React Compiler)
        run: pnpm check:resource-memo

  review-policy:
    name: Review Policy Scripts
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @assistant-ui/x-buildutils --ignore-scripts

      - name: Test review policy scripts
        run: pnpm run review-policy:test

      - name: Check review policy synchronization
        run: node scripts/sync-review-policy.mjs --check

  workspace-ranges:
    name: Workspace Ranges
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          install: false

      - name: Test the shared script helpers
        run: node --test scripts/lib/*.test.mjs

      - name: Test the workspace range checker
        run: node --test scripts/check-workspace-ranges.test.mjs

      - name: Verify published packages publish caret workspace ranges
        run: node scripts/check-workspace-ranges.mjs

  skills-commit:
    name: Skills Commit Pins
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          install: false

      - name: Test the skills commit checker
        run: node --test scripts/check-skills-commit.test.mjs

      - name: Verify the skills commit is pinned consistently
        run: node scripts/check-skills-commit.mjs

  worktree-prune:
    name: Worktree Prune Script
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          install: false

      - name: Test the worktree prune script
        run: node --test scripts/prune-worktrees.test.mjs

  build:
    name: Build Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Test CI comparison base preparation
        run: node --test scripts/prepare-ci-base.test.mjs

      - name: Detect package build inputs
        id: package_build_inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=HEAD^1
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "${{ github.event_name }}" = "push" ] && ! git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            BASE=HEAD^1
          fi
          if git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            run=$(git diff --name-only --no-renames -z "$BASE" HEAD | node scripts/package-build-inputs.mjs)
          else
            run=true
            BASE=""
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and node.js
        if: steps.package_build_inputs.outputs.run == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        if: steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ] && git diff --quiet "$BASE" HEAD -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            packages/x-buildutils; then
            plan=$(node scripts/update-api-surface.mjs --base "$BASE" --print-filters)
            mapfile -t filters < <(jq -r 'if length == 0 then "--filter=./packages/*..." else .[] | "--filter=\(.)..." end' <<< "$plan")
            pnpm install --frozen-lockfile \
              --filter="." \
              --filter="@assistant-ui/api-surface" \
              --filter="@assistant-ui/react-devtools..." \
              --filter="@assistant-ui/x-buildutils..." \
              --filter="@assistant-ui/x-performance" \
              "${filters[@]}" \
              --filter="!./apps/*" \
              --filter="!./examples/*" \
              --filter="!./templates/*"
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build packages
        if: steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm api-surface -- --base="$BASE" --build-only

      - name: Check API surface
        if: steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
        run: pnpm run api-surface:check -- --skip-build --base="$BASE"

      - name: Check distribution barrels
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run distributions:check

      - name: Check experimental API annotations
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run experimental:check

      - name: Check built declarations
        if: steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
        run: pnpm run declarations:check -- --filter="...[$BASE]"

      - name: Test built declaration checker
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run declarations:test

      - name: Test the distribution barrel checker
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run distributions:test

      - name: Test the experimental annotation checker
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run experimental:test

      - name: Test the deploy examples planner
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run deploy-examples:test

      - name: Test API surface generator
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run api-surface:test

      - name: Test API reference input detector
        if: steps.package_build_inputs.outputs.run == 'true'
        run: pnpm run api-reference-inputs:test

      - name: Test package build input detector
        run: node --test scripts/package-build-inputs.test.mjs

      - name: Test Redis build cache isolation
        if: steps.package_build_inputs.outputs.run == 'true'
        run: node --test scripts/turbo-redis-env.test.mjs

      - name: Measure bundle sizes against the base
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && steps.package_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.package_build_inputs.outputs.base }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          set -euo pipefail
          node packages/x-performance/bin/aui-perf.mjs size --ref "$BASE" --report "$RUNNER_TEMP/size.md"
          if [ -f "$RUNNER_TEMP/size.md" ]; then cat "$RUNNER_TEMP/size.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Post the size report as a sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_MARKER: "<!-- aui-size-report -->"
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$REPORT_MARKER\"))) | .id" | sed -n '1p')
          if [ -f "$RUNNER_TEMP/size.md" ] && [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" --method PATCH -F body=@"$RUNNER_TEMP/size.md"
          elif [ -f "$RUNNER_TEMP/size.md" ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --method POST -F body=@"$RUNNER_TEMP/size.md"
          elif [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" --method DELETE
          fi

  build-apps:
    name: Build Changed Apps
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Detect app build inputs
        id: app_build_inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=HEAD^1
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "${{ github.event_name }}" = "push" ] && ! git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            BASE=HEAD^1
          fi
          if git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            run=$(git diff --name-only --no-renames -z "$BASE" HEAD | node scripts/app-build-inputs.mjs)
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Test app build input detector
        run: node --test scripts/app-build-inputs.test.mjs

      - name: Test CI task planner
        run: node --test scripts/ci-has-tasks.test.mjs

      - name: Test source-mapped tsconfig paths
        run: node --test scripts/source-mapped-tsconfigs.test.mjs

      - name: Setup pnpm and node.js
        if: steps.app_build_inputs.outputs.run == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        if: steps.app_build_inputs.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # apps/docs is excluded: its build belongs to the Vercel deployment.
      # Examples are demos, so a package change does not rebuild them; an example is built only
      # when its own files change, and deploy-examples builds the deployed ones on main.
      - name: Build apps
        if: steps.app_build_inputs.outputs.run == 'true'
        env:
          BASE: ${{ steps.app_build_inputs.outputs.base }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          pnpm turbo build --filter="...[$BASE]" --filter="!./packages/*" --filter="!./api-surface" --filter="!@assistant-ui/docs" --filter="!./examples/*"
          pnpm turbo build --filter="{./examples/*}[$BASE]"

      - name: Verify standalone example bundle contracts
        if: steps.app_build_inputs.outputs.run == 'true'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm test:bundles

  api-reference-drift:
    name: API Reference Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Detect API reference inputs
        id: api_ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=HEAD^1
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "${{ github.event_name }}" = "push" ] && ! git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            BASE=HEAD^1
          fi
          if ! git rev-parse --verify "$BASE" >/dev/null; then
            echo "Unable to resolve API reference diff base: $BASE"
            exit 1
          fi
          run="$(git diff --name-only --no-renames -z "$BASE" | node scripts/api-reference-inputs.mjs)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm and node.js
        if: steps.api_ref.outputs.run == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        if: steps.api_ref.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --filter . --filter="@assistant-ui/docs..." --filter="@assistant-ui/eve..."

      - name: Generate API reference (strict)
        if: steps.api_ref.outputs.run == 'true'
        run: pnpm -C apps/docs generate:api-reference -- --strict

      - name: Fail on API reference drift
        if: steps.api_ref.outputs.run == 'true'
        run: |
          if git status --porcelain -- 'apps/docs/content/docs/(reference)/api-reference' | grep -q .; then
            echo "API reference pages are stale. JSDoc or export changes are not reflected in apps/docs/content/docs/(reference)/api-reference."
            echo "Run \`pnpm -C apps/docs generate:api-reference\` and commit the result."
            echo "Durable hand-written prose belongs in source JSDoc or api-manual slots."
            git status --porcelain -- 'apps/docs/content/docs/(reference)/api-reference'
            git diff -- 'apps/docs/content/docs/(reference)/api-reference'
            exit 1
          fi

  typecheck:
    name: Typecheck Changed Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Prepare CI comparison base
        if: github.event_name == 'pull_request'
        run: node scripts/prepare-ci-base.mjs

      - name: Resolve CI comparison base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=HEAD^1
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "${{ github.event_name }}" = "push" ] && ! git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null; then
            BASE=HEAD^1
          fi
          echo "CI_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Detect typecheck tasks
        id: tasks
        run: |
          set -euo pipefail
          run=$(node scripts/ci-has-tasks.mjs "$CI_BASE" typecheck --filter="...[$CI_BASE]")
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.tasks.outputs.run == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet "$CI_BASE" HEAD -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            turbo.json \
            packages/x-buildutils; then
            pnpm install --frozen-lockfile --filter . --filter="@assistant-ui/react-devtools..." --filter="...[$CI_BASE]..." --filter="!@assistant-ui/api-surface"
          else
            pnpm install --frozen-lockfile
          fi

      - name: Typecheck
        if: steps.tasks.outputs.run == 'true'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: bash scripts/typecheck.sh --continue --filter="...[$CI_BASE]"
