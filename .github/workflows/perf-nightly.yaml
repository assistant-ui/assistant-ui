name: Performance Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  measure:
    permissions:
      contents: read
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # ratchet:pnpm/setup@v3.1.1
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @assistant-ui/react-devtools... --filter @assistant-ui/x-performance...

      - name: Build measured packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm turbo run build --filter=@assistant-ui/tap --filter=@assistant-ui/core --filter=@assistant-ui/store --filter=assistant-stream --filter=@assistant-ui/react --filter=@assistant-ui/react-markdown --filter=@assistant-ui/ai-sdk --filter=@assistant-ui/react-langgraph --filter=@assistant-ui/react-pi

      - name: Record nightly benchmarks
        run: node packages/x-performance/bin/aui-perf.mjs record nightly.json --runs 4

      - name: Upload nightly recording
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: nightly-recording
          path: packages/x-performance/.perf/nightly.json
          include-hidden-files: true

  publish:
    needs: measure
    permissions:
      contents: write
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Download nightly recording
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: nightly-recording
          path: packages/x-performance/.perf

      - name: Append and render the nightly history
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          history_dir="$RUNNER_TEMP/history"
          if git fetch origin perf-history; then
            git worktree add "$history_dir" FETCH_HEAD
          else
            git worktree add --orphan -b perf-history "$history_dir"
          fi
          node packages/x-performance/bin/aui-perf.mjs history append --dir "$history_dir/history" --from packages/x-performance/.perf/nightly.json
          node packages/x-performance/bin/aui-perf.mjs history render --dir "$history_dir/history" --out "$history_dir/README.md"
          cat "$history_dir/README.md" >> "$GITHUB_STEP_SUMMARY"
          git -C "$history_dir" config user.name "github-actions[bot]"
          git -C "$history_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$history_dir" add README.md history
          git -C "$history_dir" commit -m "nightly $SHA"
          git -C "$history_dir" push origin HEAD:perf-history
