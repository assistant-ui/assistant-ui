name: Docs syntax highlighting comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-highlighter-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      CI: "1"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: warn
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_AUI_AI_PLAYGROUND_ENABLED: "1"
      NEXT_PUBLIC_WEBMCP_ENABLED: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      CIRCLE_NODE_TOTAL: "3"
      RAYON_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: 6229e91ac5500138885696108de4e7e9ff2f8ec4
          path: comparison/base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: a1452ba699473b69eaea120ed0afe1c1f7ece55a
          path: comparison/head
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - name: Install pinned package manager
        run: npm install --global pnpm@12.15.0
      - name: Compare pinned baseline and PR head
        run: python3 .github/benchmarks/docs-current-pr.py
      - name: Upload measurements and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: docs-highlighter-comparison
          path: comparison-results
          retention-days: 7
