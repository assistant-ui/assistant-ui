name: Review Tier

# Pull request and review events reach this workflow through Review Tier Relay,
# an unprivileged pull_request workflow, so no pull_request_target run ever holds
# these credentials. The relay only names a pull request; this workflow runs
# base-branch code and re-reads that pull request from the API.
on:
  issues:
    types: [labeled, unlabeled]
  workflow_run:
    workflows: [Review Tier Relay]
    types: [completed]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Evaluate review tier
    # The relay filters label and edit events; this job only checks that the relay succeeded.
    if: >-
      vars.REVIEW_POLICY_APP_ID != '' &&
      (github.event_name != 'issues' || github.event.label.name == 'decision: accepted') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    # Relayed runs are not checks on the pull request, so a newer relay for the same branch cancels the older evaluation; the newer one re-reads all state. Fork relays carry no pull request number, so they group by head repository and branch.
    concurrency:
      group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_run' && format('relay-{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)) || github.event.merge_group.head_sha || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # These events run with repository credentials, so only base-branch code is checked out and executed. workflow_run always runs the default branch's workflow and ref.
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || '' }}
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # ratchet:pnpm/setup@v3.1.2
        with:
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @assistant-ui/x-buildutils --ignore-scripts

      - name: Create a policy app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.REVIEW_POLICY_APP_ID }}
          private-key: ${{ secrets.REVIEW_POLICY_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write

      # The relay can run code from the pull request, so its artifact is untrusted: it lands outside the checkout, where it cannot replace scripts or dependencies, and review-tier.mjs accepts only digits from it.
      - name: Download the relayed pull request number
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: review-tier-pr
          path: ${{ runner.temp }}/review-tier-pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Evaluate and publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_TIER_RELAY_FILE: ${{ runner.temp }}/review-tier-pr/number
        run: node scripts/review-tier.mjs
