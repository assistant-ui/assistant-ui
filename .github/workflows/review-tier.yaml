name: Review Tier

on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
        closed,
      ]
  issues:
    types: [labeled, unlabeled]
  workflow_run:
    workflows: [Review Tier Relay]
    types: [completed]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Evaluate review tier
    if: >-
      vars.REVIEW_POLICY_APP_ID != '' &&
      !(github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        startsWith(github.event.label.name, 'tier/')) &&
      (github.event_name != 'issues' || github.event.label.name == 'decision: accepted')
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # These events run with repository credentials, so only base-branch code is checked out and executed.
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || '' }}
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter . --filter @assistant-ui/x-buildutils --ignore-scripts

      - name: Create a policy app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.REVIEW_POLICY_APP_ID }}
          private-key: ${{ secrets.REVIEW_POLICY_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write

      - name: Download the relayed pull request number
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: review-tier-pr
          path: review-tier-pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Evaluate and publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEW_TIER_RELAY_FILE: review-tier-pr/number
        run: node scripts/review-tier.mjs
