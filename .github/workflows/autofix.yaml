name: autofix.ci

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: node scripts/autofix-install.mjs --base="$BASE"

      - name: Check resource memoization (React Compiler)
        run: pnpm check:resource-memo

      - name: Lint fix
        run: pnpm lint:fix

      - name: Detect API reference inputs
        id: api_ref
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "$BASE" >/dev/null; then
            echo "Unable to resolve API reference diff base: $BASE"
            exit 1
          fi
          run="$(git diff --name-only --no-renames -z "$BASE" | node scripts/api-reference-inputs.mjs)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install API reference dependencies
        if: steps.api_ref.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --filter="@assistant-ui/docs..."

      - name: Update API surface snapshots
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm api-surface -- --base="$BASE"

      - name: Update API reference pages
        if: steps.api_ref.outputs.run == 'true'
        run: pnpm -C apps/docs generate:api-reference

      - name: Check merge queue drift
        if: github.event_name == 'merge_group'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "autofix would change the files above; run pnpm lint:fix, pnpm api-surface and pnpm -C apps/docs generate:api-reference on the pull request before it enters the queue"
            exit 1
          fi

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # ratchet:autofix-ci/action@v1.3.4
        if: github.event_name == 'pull_request'
        with:
          fail-fast: false
