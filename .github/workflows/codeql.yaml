name: CodeQL

on:
  # Pushes to main are never path-filtered: every commit there needs an analysis for pull requests to be compared against.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            paths: .github/workflows
          - language: javascript-typescript
            paths: >-
              .
              :(exclude).github/workflows
              :(exclude)python
              :(exclude,glob)**/*.py
              :(exclude,glob)**/*.md
              :(exclude,glob)**/*.mdx
          - language: python
            paths: :(glob)**/*.py
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      # A pull request only analyzes the languages it touches. Pushes and scheduled runs skip this step and analyze all three.
      - name: Select language
        id: selection
        if: github.event_name == 'pull_request'
        env:
          LANGUAGE_PATHS: ${{ matrix.paths }}
        run: |
          set -euo pipefail
          read -ra paths <<< "$LANGUAGE_PATHS"
          run=true
          if git diff --quiet --no-renames HEAD^1 HEAD -- "${paths[@]}" &&
            git diff --quiet --no-renames HEAD^1 HEAD -- .github/workflows/codeql.yaml; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: steps.selection.outputs.run != 'false'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # ratchet:github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        if: steps.selection.outputs.run != 'false'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # ratchet:github/codeql-action/analyze@v4.38.3
        with:
          category: /language:${{ matrix.language }}
