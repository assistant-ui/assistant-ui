name: Deploy Examples

# The trigger list is the union of the per example inputs in the changes job;
# keep both in step.
on:
  push:
    branches:
      - main
    paths:
      - examples/with-expo/**
      - examples/with-react-ink-web/**
      - packages/react-native/**
      - packages/ui/**
      - packages/metro/**
      - packages/react-ink/**
      - packages/react-ink-markdown/**
      - packages/ai-sdk/**
      - packages/core/**
      - .github/workflows/deploy-examples.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  changes:
    name: Changed examples
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Pick the examples whose inputs changed
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            changed=$'examples/with-expo/\nexamples/with-react-ink-web/'
          else
            git fetch --no-tags --depth=1 origin "$BEFORE"
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          fi

          matches() {
            local example=$1 file
            while IFS= read -r file; do
              case $example:$file in
                with-expo:examples/with-expo/*|with-expo:packages/react-native/*|with-expo:packages/ui/*|with-expo:packages/metro/*|with-expo:packages/ai-sdk/*|with-expo:packages/core/*|with-expo:.github/workflows/deploy-examples.yaml) return 0 ;;
                with-react-ink-web:examples/with-react-ink-web/*|with-react-ink-web:packages/react-ink/*|with-react-ink-web:packages/react-ink-markdown/*|with-react-ink-web:packages/ai-sdk/*|with-react-ink-web:packages/core/*|with-react-ink-web:.github/workflows/deploy-examples.yaml) return 0 ;;
              esac
            done <<< "$changed"
            return 1
          }

          include='[]'
          if matches with-expo; then
            include=$(jq -c '. + [{"example":"with-expo","chat-endpoint-url":"https://www.assistant-ui.com/api/chat"}]' <<< "$include")
          fi
          if matches with-react-ink-web; then
            include=$(jq -c '. + [{"example":"with-react-ink-web"}]' <<< "$include")
          fi

          echo "matrix=$(jq -c '{include: .}' <<< "$include")" >> "$GITHUB_OUTPUT"
          echo "any=$(jq -r 'length > 0' <<< "$include")" >> "$GITHUB_OUTPUT"
          echo "deploying: $(jq -r 'map(.example) | join(", ") | if . == "" then "nothing" else . end' <<< "$include")"

  deploy-production:
    name: Deploy Production (${{ matrix.example }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      VERCEL_PROJECT_ID: ${{ matrix.example == 'with-expo' && secrets.VERCEL_EXPO_PROJECT_ID || matrix.example == 'with-react-ink-web' && secrets.VERCEL_INK_PROJECT_ID || '' }}
      EXPO_PUBLIC_CHAT_ENDPOINT_URL: ${{ matrix.chat-endpoint-url }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.example }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.example }}-${{ github.ref }}-
            ${{ runner.os }}-turbo-${{ matrix.example }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: examples/${{ matrix.example }}
        run: pnpm exec vercel pull --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: examples/${{ matrix.example }}
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: examples/${{ matrix.example }}
        run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
