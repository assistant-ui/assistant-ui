name: Deploy Examples

on:
  push:
    branches:
      - main
    paths:
      - examples/with-expo/**
      - examples/with-react-ink-web/**
      - packages/react-native/**
      - packages/react-ink/**
      - packages/react-ink-markdown/**
      - packages/react-ai-sdk/**
      - packages/core/**
      - .github/workflows/deploy-examples.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy-production:
    name: Deploy Production (${{ matrix.example }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: with-expo
            chat-endpoint-url: https://www.assistant-ui.com/api/chat
          - example: with-react-ink-web
    env:
      VERCEL_PROJECT_ID: ${{ matrix.example == 'with-expo' && secrets.VERCEL_EXPO_PROJECT_ID || matrix.example == 'with-react-ink-web' && secrets.VERCEL_INK_PROJECT_ID || '' }}
      EXPO_PUBLIC_CHAT_ENDPOINT_URL: ${{ matrix.chat-endpoint-url }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # ratchet:pnpm/action-setup@v6.0.9

      - name: Setup node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Cache turbo build setup
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # ratchet:actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.example }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.example }}-${{ github.ref }}-
            ${{ runner.os }}-turbo-${{ matrix.example }}-

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: examples/${{ matrix.example }}
        run: vercel pull --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: examples/${{ matrix.example }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: examples/${{ matrix.example }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
