name: Docs Cache Probe

# Experiment branch only, never merged: builds the same commit of apps/docs as
# six Git-based Vercel previews in a row, each restoring the previous build's
# cache, so identical rebuilds with the Turbopack build cache can be compared.
on:
  push:
    branches:
      - perf/docs-cache-probe

permissions:
  contents: read

concurrency:
  group: docs-cache-probe
  cancel-in-progress: false

jobs:
  preview:
    name: Build the same commit six times
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
      PROJECT_ID: prj_alMGZSXeFUhPBYPfWcfNM1VDJAls
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Deploy and wait for each cache upload
        run: |
          set -euo pipefail
          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" "$@"
          }
          body=$(jq -n --arg p "$PROJECT_ID" --arg sha "$GITHUB_SHA" '{
            name: "assistant-ui", project: $p,
            gitSource: { type: "github", org: "assistant-ui", repo: "assistant-ui",
                         ref: "perf/docs-cache-probe", sha: $sha } }')
          for i in 1 2 3 4 5 6; do
            dep=$(api -X POST "https://api.vercel.com/v13/deployments?teamId=$TEAM_ID" -d "$body") || { echo "create failed: $dep"; exit 1; }
            id=$(jq -r .id <<<"$dep")
            echo "build $i: id=$id url=https://$(jq -r .url <<<"$dep")"
            state=""
            for t in $(seq 1 120); do
              state=$(api "https://api.vercel.com/v13/deployments/$id?teamId=$TEAM_ID" | jq -r .readyState)
              case "$state" in READY|ERROR|CANCELED) break ;; esac
              sleep 15
            done
            echo "build $i: state=$state"
            [ "$state" = READY ] || exit 1
            # The deployment is READY before its build cache is uploaded; the next
            # build must restore this one's cache.
            for t in $(seq 1 60); do
              if api "https://api.vercel.com/v3/deployments/$id/events?teamId=$TEAM_ID&limit=-1" | grep -q "Build cache uploaded"; then
                echo "build $i: cache uploaded"
                break
              fi
              sleep 15
            done
          done
