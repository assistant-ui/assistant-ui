name: Docs Cache Probe

# Experiment branch only, never merged: deploys apps/docs as a Vercel preview
# with the Turbopack build cache on, so identical rebuilds can be compared.
on:
  push:
    branches:
      - perf/docs-cache-probe

permissions:
  contents: read

concurrency:
  group: docs-cache-probe
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy docs preview
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: prj_alMGZSXeFUhPBYPfWcfNM1VDJAls
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # ratchet:pnpm/setup@v3.1.2
        with:
          cache: false
          install: false

      # The Vercel CLI comes from the lockfile pin that with-react-ink-web declares.
      - name: Install the pinned Vercel CLI
        run: pnpm install --frozen-lockfile --ignore-scripts --filter with-react-ink-web

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm --filter with-react-ink-web exec vercel deploy --target preview --force --with-cache --yes --cwd "$GITHUB_WORKSPACE" --token="$VERCEL_TOKEN"
