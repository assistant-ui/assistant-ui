name: Autofix Install Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline full install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Exercise autofix dependencies
        run: |
          pnpm check:resource-memo
          pnpm lint
          pnpm exec turbo build --filter="@assistant-ui/tap"
          node scripts/generate-api-surface.mjs --filter="@assistant-ui/tap"

  filtered:
    name: Filtered install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter=. \
            --filter="@assistant-ui/x-buildutils..." \
            --filter="@assistant-ui/tap..."

      - name: Exercise autofix dependencies
        run: |
          pnpm check:resource-memo
          pnpm lint
          pnpm exec turbo build --filter="@assistant-ui/tap"
          node scripts/generate-api-surface.mjs --filter="@assistant-ui/tap"
