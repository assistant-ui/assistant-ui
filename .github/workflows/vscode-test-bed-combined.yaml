name: VS Code Test Bed (combined branches)

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch to check out; it must contain examples/with-vscode
        required: true
        default: main
        type: string
      branches:
        description: Branches whose commits not on origin/main or base are applied on top of base, separated by spaces or commas
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.base }}-${{ inputs.branches }}
  cancel-in-progress: true

env:
  # Keep in step with vscode-test-bed.yaml.
  AUI_TESTBED_VSCODE_VERSION: 1.140.0

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Phase 1 probes (ai-sdk)
            artifact: probes-ai-sdk
            runtime: ai-sdk
            phase: 1
            script: probes
          - name: Screenshots
            artifact: screenshots
            runtime: ""
            phase: 0
            script: screenshots
    steps:
      - name: Validate inputs
        env:
          BASE: ${{ inputs.base }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          set -euo pipefail
          set -f
          valid='^[A-Za-z0-9._/-]+$'
          if [[ ! "$BASE" =~ $valid ]]; then
            echo "::error::base '$BASE' does not match $valid"
            exit 1
          fi
          for branch in ${BRANCHES//,/ }; do
            if [[ ! "$branch" =~ $valid ]]; then
              echo "::error::branch '$branch' does not match $valid"
              exit 1
            fi
          done

      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply branches
        env:
          BRANCHES: ${{ inputs.branches }}
        run: |
          set -euo pipefail
          set -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          {
            echo "### Combined checkout"
            echo
            echo "Base: \`$(git rev-parse --abbrev-ref HEAD)\` at $(git rev-parse --short HEAD)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for branch in ${BRANCHES//,/ }; do
            if ! git rev-parse --verify --quiet "origin/$branch^{commit}" > /dev/null; then
              echo "::error::Branch '$branch' was not found on origin"
              exit 1
            fi
            commits=$(git rev-list --reverse --no-merges "origin/$branch" --not origin/main "$base")
            if [ -z "$commits" ]; then
              echo "::error::Branch '$branch' has no commits that origin/main and the base lack"
              exit 1
            fi
            echo "Applying $(wc -l <<< "$commits") commit(s) of $branch"
            # shellcheck disable=SC2086
            if ! git cherry-pick --no-commit $commits; then
              echo "::error::Applying '$branch' onto the combined tree conflicts:"
              git status --short
              exit 1
            fi
            echo "- \`$branch\` at $(git rev-parse --short "origin/$branch"), $(wc -l <<< "$commits") commit(s)" >> "$GITHUB_STEP_SUMMARY"
          done
          git status --short

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install VS Code system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm turbo build --filter='with-vscode^...'

      - name: Cache VS Code
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: examples/with-vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ env.AUI_TESTBED_VSCODE_VERSION }}

      - name: Run ${{ matrix.script }} in VS Code
        env:
          AUI_TESTBED_PHASE: ${{ matrix.phase }}
          AUI_TESTBED_RUNTIMES: ${{ matrix.runtime }}
          SCRIPT: ${{ matrix.script }}
        run: xvfb-run -a pnpm --filter with-vscode "$SCRIPT"

      - name: Upload screenshots
        id: upload
        if: always() && matrix.script == 'screenshots'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: vscode-test-bed-combined-screenshots
          path: examples/with-vscode/screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Link the contact sheet
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "Download [vscode-test-bed-combined-screenshots]($ARTIFACT_URL), unzip it and open \`gallery/index.html\` for the contact sheet." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: vscode-test-bed-combined-${{ matrix.artifact }}-report
          path: examples/with-vscode/test-results/
          retention-days: 14
          if-no-files-found: warn
