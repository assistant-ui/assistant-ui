name: Scheduled Failure Issue

on:
  workflow_call:
    inputs:
      title:
        description: "Tracking issue title; an open issue with this title gets a comment instead of a duplicate"
        required: true
        type: string

permissions:
  issues: write

jobs:
  report:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Open or comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --state open --label maintenance --limit 100 --json number,title --jq 'map(select(.title == env.TITLE)) | first | .number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "The scheduled run failed again: $RUN_URL"
            exit 0
          fi
          workflow_path="${WORKFLOW_REF#*/*/}"
          gh issue create --title "$TITLE" --label maintenance --body "### Problem

          The scheduled run failed: $RUN_URL

          ### Where

          \`${workflow_path%@*}\`

          ### Done when

          A scheduled run passes."
