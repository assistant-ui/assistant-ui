name: Python Stream Tests

on:
  push:
    branches: [main, perf/python-selection-benchmark]
    paths:
      - "python/**"
      - "!python/assistant-ui-sync-server-api/**"
      - ".github/workflows/python-tests.yaml"
      - ".github/workflows/python-stream-tests.yaml"
      - ".github/workflows/python-sync-server-tests.yaml"
      - "scripts/python-test-workflows.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "!python/assistant-ui-sync-server-api/**"
      - ".github/workflows/python-tests.yaml"
      - ".github/workflows/python-stream-tests.yaml"
      - ".github/workflows/python-sync-server-tests.yaml"
      - "scripts/python-test-workflows.test.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/python-tests.yaml
    with:
      package: assistant-stream
