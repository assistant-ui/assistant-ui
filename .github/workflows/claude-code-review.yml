name: Claude Code Review

# Same-repository PRs use the pull_request job and Claude GitHub App. Fork PRs
# are reviewed by claude-code-review-fork.yml, which runs on workflow_run from
# the default branch and checks out no PR code.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

env:
  # Model access: see the "Get a short-lived model key" step.
  BILLING_API: https://api.assistant-billing.dev
  BILLING_PROJECT: proj_0ltyjcuaxpv1
  BILLING_GATEWAY: https://gateway.assistant-billing.dev
  # Shared action configuration
  TRACK_PROGRESS: 'true'
  USE_STICKY_COMMENT: 'true'
  ADDITIONAL_PERMISSIONS: |
    actions: read

  # jq program over the execution transcript that names the model which actually
  # served the review. A safeguard trip swaps the session to a fallback model
  # mid-run while the model's own context still claims the original, so the
  # transcript is the only reliable record. Both names come from the fallback
  # event itself, so this holds for whatever pair the classifier routes between.
  REVIEW_MODEL_NOTE: |
    (map(select(.type == "assistant") | .message.model) | last) as $served
    | (map(select(.subtype == "model_refusal_fallback")) | last) as $fallback
    | if $fallback
      then "⚠️ Reviewed by `\($fallback.fallbackModel)` — safeguard fallback from `\($fallback.originalModel)`"
      else "Reviewed by `\($served // "an unrecorded model")`"
      end

  # Everything before "When the diff is too large" must match
  # claude-code-review-fork.yml; scripts/review-tier.test.mjs checks it.
  REVIEW_INSTRUCTIONS: |
    Review as the maintainer who decides what ships, not an advisor. Weigh the implementation for correctness, security, performance, tests, and docs; enforce the repo's conventions (AGENTS.md); scale scrutiny to what the change puts at risk. Check CI through the tools available to you.

    A diff can be correct while its premise is wrong; judge the premise first:
    - A fix that hides a symptom without touching its cause is a workaround; name it, and block unless leaving the cause is justified.
    - Severity scales with reach: the npm packages are compatibility contracts where every observable change counts; registry components and templates become user-owned code, where minimal and unopinionated wins.
    - A working change that degrades the intended experience or its performance is a regression; regressions generally block.
    - Regressions hide in what the diff did not mean to change: watch the API and UI surface for subtle shifts.
    - A defect can recur wherever its pattern repeats: sibling adapters, runtimes, surfaces. Check them.

    Verify against the evidence available to you: the checked-out tree when present, PR metadata and history, and upstream documentation when web tools are available. Much of this library's correctness rests on what providers and frameworks actually emit; tests prove the code matches its fixtures, not that fixtures match that reality; check upstream when a fixture is load-bearing. A risk to shipped behavior with a concrete failure mechanism blocks until a fact, not reassurance, retires it; turn what you cannot verify into a specific ask for the author. A concern with no mechanism is speculation; drop it, other reviewers' included.

    Verdict first, terse: lead with the findings or with "No blocking findings"; never write "Approve". Lead findings with the core problem and group the rest under it. Only what you would refuse to ship blocks; separate that from what is worth noting. On a first review a sound PR gets "No blocking findings" and nothing more; never manufacture findings. Raise architectural direction as questions, not prescriptions. Stay appreciative with external contributors even while blocking. No praise sections, no process narration, no restating the diff or CI. On re-review, follow the verdict with what changed and where prior findings stand, yours and others'.

    When the diff is too large to read in full, review a bounded slice and name in the verdict what you did not review. List the changed files with `gh pr view <number> --json files` and read the riskiest with Read. The shell runs only the listed `gh` commands, one per call; pipes, `git`, and anything else are denied.

    Line-anchored findings go inline via mcp__github_inline_comment__create_inline_comment, deduplicated against existing comments. Put everything else in the sticky comment with no progress placeholders left, and write the verdict there even when the review is partial.

  # Allowed tools:
  # - WebSearch/WebFetch: Verify provider/framework behavior against upstream docs and changelogs
  # - mcp__github_inline_comment__create_inline_comment: Create inline code comments
  # - Bash(gh ...): Read-only GitHub CLI commands for PR/issue info
  # Note: gh pr comment is NOT allowed - Claude must use update_claude_comment only
  CLAUDE_ARGS: '--model claude-opus-5-5 --effort high --allowedTools "WebSearch,WebFetch,mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

jobs:
  claude-review:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.sender.type != 'Bot'
    # Job-level so that runs skipped by the `if` guard never enter the group; a
    # workflow-level group would cancel the in-flight review of the previous
    # head before the guard is evaluated (e.g. on autofix.ci pushes).
    concurrency:
      group: claude-code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1

      # Reviews run on a short-lived key instead of a stored credential: the
      # job trades its GitHub OIDC token at assistant-billing for a key that
      # expires in minutes, works once per token, and only reaches the
      # messages endpoints of the billing gateway, which meters the run.
      - name: Get a short-lived model key
        id: model-key
        run: |
          OIDC=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BILLING_API" | jq -r .value)
          echo "::add-mask::$OIDC"
          KEY=$(curl -fsS -X POST "$BILLING_API/oidc/github/token" \
            -H "Authorization: Bearer $OIDC" -H "content-type: application/json" \
            -d "{\"project_id\":\"$BILLING_PROJECT\"}" | jq -r .key)
          echo "::add-mask::$KEY"
          [[ "$KEY" == temp_ab_* ]] || { echo "::error::assistant-billing refused the key exchange"; exit 1; }
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # ratchet:anthropics/claude-code-action@v1.0.244
        env:
          ANTHROPIC_BASE_URL: ${{ env.BILLING_GATEWAY }}
        with:
          anthropic_api_key: ${{ steps.model-key.outputs.key }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            TITLE: ${{ github.event.pull_request.title }}
            BODY: ${{ github.event.pull_request.body }}
            AUTHOR: ${{ github.event.pull_request.user.login }}
            COMMIT: ${{ github.event.pull_request.head.sha }}
            Note: The PR branch is already checked out in the current working directory.

            ${{ env.REVIEW_INSTRUCTIONS }}
          use_sticky_comment: ${{ fromJSON(env.USE_STICKY_COMMENT) }}
          track_progress: ${{ fromJSON(env.TRACK_PROGRESS) }}
          claude_args: ${{ env.CLAUDE_ARGS }}
          additional_permissions: ${{ env.ADDITIONAL_PERMISSIONS }}

      # The action reports success even when the Claude execution errors out
      # (e.g. expired OAuth token or exhausted usage limit), leaving PRs with a
      # green check and no review. Fail loudly and surface the error text,
      # which the action redacts from its own logs.
      - name: Fail on Claude execution error
        if: always()
        run: |
          FILE='${{ steps.review.outputs.execution_file }}'
          [ -f "$FILE" ] || exit 0
          jq -e 'last(.[] | select(.type == "result")) | .is_error == true' "$FILE" >/dev/null || exit 0
          echo "::error::Claude review failed: $(jq -r 'last(.[] | select(.type == "result")) | .result // "no error text"' "$FILE" | tr '\n' ' ' | head -c 500)"
          exit 1

      # Attribute every review to the model that served it, so a safeguard
      # fallback is visible in the comment itself rather than only in the run
      # log. Runs after the error gate so a failed run is not annotated.
      - name: Attribute review model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE='${{ steps.review.outputs.execution_file }}'
          [ -f "$FILE" ] || exit 0
          NOTE=$(jq -r "$REVIEW_MODEL_NOTE" "$FILE")
          jq -e 'any(.[]; .subtype == "model_refusal_fallback")' "$FILE" >/dev/null \
            && echo "::warning::$NOTE"

          COMMENT=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]")' | jq -s 'last')
          [ -n "$COMMENT" ] && [ "$COMMENT" != "null" ] || exit 0

          BODY_FILE="$RUNNER_TEMP/claude-review.md"
          {
            jq -r .body <<<"$COMMENT" | sed '/<!-- review-model -->/,$d'
            printf '\n<!-- review-model -->\n<sub>%s</sub>\n' "$NOTE"
          } > "$BODY_FILE"
          jq -n --rawfile body "$BODY_FILE" '{ body: $body }' > "$RUNNER_TEMP/claude-review.json"
          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$(jq -r .id <<<"$COMMENT")" \
            --input "$RUNNER_TEMP/claude-review.json" >/dev/null

      # A run can also end cleanly without writing its final review into the
      # sticky comment, leaving it on the progress todos the action's own
      # tracking writes. Publish the run's final response there instead, as the
      # fork job does, and fail only when the run left nothing to publish.
      - name: Publish an unfinished review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          COMMENT=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]")' | jq -s 'last')
          [ -n "$COMMENT" ] && [ "$COMMENT" != "null" ] || exit 0
          jq -r .body <<<"$COMMENT" | grep -qE '^- \[ \]' || exit 0

          if [ ! -f "$REVIEW_FILE" ] || ! jq -e 'last(.[] | select(.type == "result")) | .is_error == false and (.result | type == "string" and length > 0)' "$REVIEW_FILE" >/dev/null; then
            echo "::error::Claude review ended without posting the final review (progress todos left unchecked)"
            exit 1
          fi

          echo "::warning::Claude review ended without updating its comment; publishing its final response there"
          BODY_FILE="$RUNNER_TEMP/claude-review-final.md"
          {
            jq -r 'last(.[] | select(.type == "result")) | .result' "$REVIEW_FILE"
            printf '\n<!-- review-model -->\n<sub>%s</sub>\n' "$(jq -r "$REVIEW_MODEL_NOTE" "$REVIEW_FILE")"
          } > "$BODY_FILE"
          jq -n --rawfile body "$BODY_FILE" '{ body: $body }' > "$RUNNER_TEMP/claude-review-final.json"
          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$(jq -r .id <<<"$COMMENT")" \
            --input "$RUNNER_TEMP/claude-review-final.json" >/dev/null
