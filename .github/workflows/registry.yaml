name: Deploy Shadcn Registry

on:
  workflow_call:
    inputs:
      releaseSha:
        description: "Release commit SHA to deploy"
        required: true
        type: string
    secrets:
      VERCEL_ORG_ID:
        required: true
      VERCEL_REGISTRY_PROJECT_ID:
        required: true
      VERCEL_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      releaseSha:
        description: "Commit SHA to deploy (defaults to latest default-branch commit)"
        required: false
        type: string

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_REGISTRY_PROJECT_ID }}

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    # A literal group, because inside a workflow_call github.workflow names the
    # caller, so a release deploy and a manual one would not exclude each other.
    concurrency:
      group: deploy-shadcn-registry
      cancel-in-progress: false
    steps:
      - name: Resolve deploy commit SHA
        id: deploy-sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        env:
          REQUESTED_SHA: ${{ inputs.releaseSha }}
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch;
            let deploySha = (process.env.REQUESTED_SHA ?? "").trim().toLowerCase();

            if (!deploySha) {
              const ref = await github.rest.git.getRef({
                ...context.repo,
                ref: `heads/${defaultBranch}`,
              });
              deploySha = ref.data.object.sha;
            }

            if (!/^[0-9a-f]{40}$/.test(deploySha)) {
              core.setFailed(
                `releaseSha must be a full 40-character commit SHA: ${deploySha}`,
              );
              return;
            }

            const { repository } = await github.graphql(
              `query ($owner: String!, $repo: String!, $branch: String!, $sha: String!) {
                repository(owner: $owner, name: $repo) {
                  ref(qualifiedName: $branch) {
                    compare(headRef: $sha) {
                      status
                    }
                  }
                }
              }`,
              { ...context.repo, branch: `refs/heads/${defaultBranch}`, sha: deploySha },
            );
            if (!["BEHIND", "IDENTICAL"].includes(repository.ref.compare.status)) {
              core.setFailed(
                `${deploySha} is not on ${defaultBranch}; refusing to deploy`,
              );
              return;
            }

            core.setOutput("value", deploySha);

      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ steps.deploy-sha.outputs.value }}

      - name: Validate the packages are published
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        env:
          DEPLOY_SHA: ${{ steps.deploy-sha.outputs.value }}
        with:
          script: |
            const fs = require("node:fs");

            const deploySha = process.env.DEPLOY_SHA;
            const pendingChangesets = fs
              .readdirSync(".changeset")
              .filter((file) => file.endsWith(".md") && file !== "README.md");
            if (pendingChangesets.length > 0) {
              core.setFailed(
                `${deploySha} has ${pendingChangesets.length} pending changesets, so its packages are not on npm yet; the registry deploys after the next npm publish`,
              );
              return;
            }

            const lookup = async ({ name, version }) => {
              try {
                const response = await fetch(
                  `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`,
                  { signal: AbortSignal.timeout(15_000) },
                );
                return `HTTP ${response.status}`;
              } catch (error) {
                return error.message;
              }
            };

            let unpublished = fs
              .readdirSync("packages")
              .map((dir) => `packages/${dir}/package.json`)
              .filter((file) => fs.existsSync(file))
              .map((file) => JSON.parse(fs.readFileSync(file, "utf8")))
              .filter((manifest) => manifest.private !== true);

            const deadline = Date.now() + 15 * 60_000;
            for (;;) {
              const results = await Promise.all(unpublished.map(lookup));
              unpublished = unpublished
                .map((manifest, index) => ({ ...manifest, result: results[index] }))
                .filter(({ result }) => result !== "HTTP 200");
              if (unpublished.length === 0 || Date.now() >= deadline) break;
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            if (unpublished.length > 0) {
              core.setFailed(
                `${deploySha} is not published yet: ${unpublished
                  .map(({ name, version, result }) => `${name}@${version} (${result})`)
                  .join(", ")}`,
              );
            }

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: apps/registry
        run: pnpm exec vercel pull --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: apps/registry
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: apps/registry
        run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Recovery guidance
        if: failure()
        env:
          DEPLOY_SHA: ${{ steps.deploy-sha.outputs.value || inputs.releaseSha }}
        run: |
          if [ -n "$DEPLOY_SHA" ]; then
            echo "::error::The registry deploy failed for ${DEPLOY_SHA}, so the registry still serves the previous release."
            echo "::error::Rerun this job, or run Deploy Shadcn Registry via workflow_dispatch with releaseSha=${DEPLOY_SHA}."
          else
            echo "::error::The registry deploy failed before it resolved a commit, so the registry still serves the previous release."
            echo "::error::Rerun this job, or run Deploy Shadcn Registry via workflow_dispatch without releaseSha to deploy the latest default-branch commit."
          fi
