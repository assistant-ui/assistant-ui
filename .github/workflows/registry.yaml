name: Deploy Shadcn Registry

on:
  repository_dispatch:
    types: [registry-deploy]
  workflow_dispatch:
    inputs:
      releaseSha:
        description: "Full main commit SHA; registry-only commits must follow a published release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_REGISTRY_PROJECT_ID }}

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy commit SHA
        id: deploy-sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        with:
          script: |
            const dispatchSha = context.payload?.client_payload?.releaseSha;
            const manualSha = context.payload?.inputs?.releaseSha;
            let deploySha = context.eventName === "repository_dispatch"
              ? dispatchSha
              : manualSha;

            if (typeof deploySha !== "string" || !deploySha.trim()) {
              core.setFailed("releaseSha is required for registry deployment");
              return;
            }

            deploySha = deploySha.trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(deploySha)) {
              core.setFailed("releaseSha must be a full 40-character commit SHA");
              return;
            }
            core.setOutput("value", deploySha);

      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.deploy-sha.outputs.value }}

      - name: Verify deploy commit and published packages
        env:
          DEPLOY_SHA: ${{ steps.deploy-sha.outputs.value }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA" || fail "Checkout does not match deploy SHA $DEPLOY_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main || fail "Unable to fetch main for the ancestry check"
          git merge-base --is-ancestor HEAD origin/main || fail "Deploy SHA $DEPLOY_SHA is not on main"
          release_commit=$DEPLOY_SHA
          if [[ "$(git log -1 --format=%s HEAD)" != "chore: update versions"* ]]; then
            if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
              git rev-parse -q --verify HEAD^2 >/dev/null || fail "$DEPLOY_SHA is not a version commit or version PR merge commit"
              release_commit=$(git log -1 --format=%H --grep='^chore: update versions' HEAD^1..HEAD^2)
              test -n "$release_commit" || fail "No version commit was found in the release merge"
              git diff --quiet "$release_commit" HEAD^2 -- packages ':(exclude)packages/ui' || fail "Published package sources changed after the version commit"
            else
              release_commit=$(git log --first-parent -1 --format=%H --grep='^chore: update versions' HEAD)
              test -n "$release_commit" || fail "No published version commit precedes this registry deploy"
              git diff --quiet "$release_commit" HEAD -- packages ':(exclude)packages/ui' || fail "Published package sources changed since the last release; publish packages before deploying the registry"
            fi
          fi
          changed_manifests=$(git diff --name-only "$release_commit^" "$release_commit" -- 'packages/*/package.json') || fail "Unable to inspect release package versions"
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            [ "$(node -p "require('./$manifest').private ? 'yes' : 'no'")" = "no" ] || continue
            package_name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")
            for attempt in 1 2 3 4 5 6; do
              published=$(npm view "$package_name@$version" version 2>/dev/null) || true
              if [ "$published" = "$version" ]; then break; fi
              if [ "$attempt" -lt 6 ]; then sleep 10; fi
            done
            test "$published" = "$version" || fail "$package_name@$version is not available on npm"
          done < <(printf '%s\n' packages/core/package.json packages/react/package.json "$changed_manifests" | sort -u)

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: apps/registry
        run: pnpm exec vercel pull --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: apps/registry
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: apps/registry
        run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
