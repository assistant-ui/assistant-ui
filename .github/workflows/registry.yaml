name: Deploy Shadcn Registry

on:
  repository_dispatch:
    types: [registry-deploy]
  workflow_dispatch:
    inputs:
      releaseSha:
        description: "Commit SHA to deploy (defaults to latest default-branch commit)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_REGISTRY_PROJECT_ID }}

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy commit SHA
        id: deploy-sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
        with:
          script: |
            const dispatchSha = context.payload?.client_payload?.releaseSha;
            const manualSha = context.payload?.inputs?.releaseSha;
            let deploySha = context.eventName === "repository_dispatch"
              ? dispatchSha
              : manualSha;

            if (typeof deploySha !== "string" || !deploySha.trim()) {
              if (context.eventName === "repository_dispatch") {
                core.setFailed("repository_dispatch payload is missing releaseSha");
                return;
              }
              const branch = context.payload.repository.default_branch;
              const ref = await github.rest.git.getRef({
                ...context.repo,
                ref: `heads/${branch}`,
              });
              deploySha = ref.data.object.sha;
            }

            deploySha = deploySha.trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(deploySha)) {
              core.setFailed("releaseSha must be a full 40-character commit SHA");
              return;
            }
            core.setOutput("value", deploySha);

      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.deploy-sha.outputs.value }}

      - name: Verify deploy commit and published packages
        env:
          DEPLOY_SHA: ${{ steps.deploy-sha.outputs.value }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA" || fail "Checkout does not match deploy SHA $DEPLOY_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || fail "Deploy SHA $DEPLOY_SHA is not on main"
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$(git log -1 --format=%s HEAD)" == "chore: update versions"* ]] || fail "$DEPLOY_SHA is not a version commit; registry was not deployed. Run Deploy Shadcn Registry manually with the published version commit SHA"
          fi
          for package in core react; do
            version=$(node -p "require('./packages/$package/package.json').version")
            for attempt in 1 2 3 4 5 6; do
              published=$(npm view "@assistant-ui/$package@$version" version 2>/dev/null) || true
              if [ "$published" = "$version" ]; then break; fi
              if [ "$attempt" -lt 6 ]; then sleep 10; fi
            done
            test "$published" = "$version" || fail "@assistant-ui/$package@$version is not available on npm"
          done

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information
        working-directory: apps/registry
        run: pnpm exec vercel pull --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: apps/registry
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: apps/registry
        run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
