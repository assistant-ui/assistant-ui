name: Python Tests

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "apps/docs/content/**/*.md*"
      - "apps/docs/lib/python-blocks.py"
      - ".github/workflows/python-tests.yaml"
      - "scripts/python-test-selection.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "apps/docs/content/**/*.md*"
      - "apps/docs/lib/python-blocks.py"
      - ".github/workflows/python-tests.yaml"
      - "scripts/python-test-selection.test.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.selection.outputs.packages }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Test Python suite selection
        run: node --test scripts/python-test-selection.test.mjs

      - name: Select Python suites
        id: selection
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          set -eo pipefail
          packages=(
            assistant-stream
            assistant-transport-backend
            assistant-transport-backend-langgraph
            assistant-ui-sync-server-api
          )
          selected=()
          if [[ -z "$BASE_REF" ]] || ! git rev-parse --verify --quiet "${BASE_REF}^{commit}" > /dev/null; then
            selected=("${packages[@]}")
          else
            samples=(':(glob)apps/docs/content/**/*.md*' apps/docs/lib/python-blocks.py ':(glob)python/*/README*.md')
            for package in "${packages[@]}"; do
              paths=(python .github/workflows/python-tests.yaml scripts/python-test-selection.test.mjs)
              for other in "${packages[@]}"; do
                if [[ "$other" != "$package" ]]; then
                  paths+=(":(exclude)python/$other")
                fi
              done
              if ! git diff --quiet --no-renames "$BASE_REF" HEAD -- "${paths[@]}"; then
                selected+=("$package")
              elif [[ "$package" == assistant-stream ]] && ! git diff --quiet --no-renames "$BASE_REF" HEAD -- "${samples[@]}"; then
                selected+=("$package")
              fi
            done
          fi
          result=$(jq -cn --args '$ARGS.positional' "${selected[@]}")
          echo "packages=$result" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    name: pytest (${{ matrix.package }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
        python-version: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        working-directory: python/${{ matrix.package }}
    services:
      postgres:
        image: ${{ matrix.package == 'assistant-stream' && 'postgres:17-alpine' || '' }} # ratchet:exclude
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assistant_stream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-start-period 5s
          --health-start-interval 1s
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: ${{ matrix.package == 'assistant-stream' && 'redis:8-alpine' || '' }} # ratchet:exclude
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-start-period 10s
          --health-start-interval 1s
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # ratchet:astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        env:
          # The Postgres thread store cases skip without a database.
          DATABASE_URL: ${{ matrix.package == 'assistant-stream' && 'postgresql://postgres:postgres@127.0.0.1:5432/assistant_stream' || '' }}
          REDIS_URL: ${{ matrix.package == 'assistant-stream' && 'redis://127.0.0.1:6379' || '' }}
        run: uv run pytest
