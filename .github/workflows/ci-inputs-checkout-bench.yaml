name: CI inputs and checkout benchmark
on:
  push:
    branches: [perf/ci-inputs-checkout-bench]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile --filter . --ignore-scripts
      - run: node scripts/bench-ci-inputs-checkout.mjs checkout
        env:
          SAMPLE: ${{ matrix.sample }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: checkout-${{ matrix.sample }}
          path: bench-results/
          retention-days: 7
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/bench-ci-inputs-checkout.mjs docs
        env:
          SAMPLE: ${{ matrix.sample }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: docs-${{ matrix.sample }}
          path: bench-results/
          retention-days: 7
