name: Expo Native Bundle

on:
  pull_request:
    paths:
      - .github/workflows/expo-native-bundle.yaml
      - examples/with-expo/**
      - package.json
      - packages/ai-sdk/**
      - packages/assistant-stream/**
      - packages/cloud/**
      - packages/core/**
      - packages/metro/**
      - packages/react-native/**
      - packages/store/**
      - packages/tap/**
      - packages/ui/**
      - packages/x-buildutils/**
      - packages/x-generative-compiler/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/expo-native-bundle.yaml
      - examples/with-expo/**
      - package.json
      - packages/ai-sdk/**
      - packages/assistant-stream/**
      - packages/cloud/**
      - packages/core/**
      - packages/metro/**
      - packages/react-native/**
      - packages/store/**
      - packages/tap/**
      - packages/ui/**
      - packages/x-buildutils/**
      - packages/x-generative-compiler/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - android
          - ios
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build --filter=@assistant-ui/react-native --filter=@assistant-ui/ai-sdk --filter=@assistant-ui/metro

      - name: Bundle Expo for ${{ matrix.platform }}
        working-directory: examples/with-expo
        run: pnpm exec expo export --platform ${{ matrix.platform }} --output-dir dist-${{ matrix.platform }}
