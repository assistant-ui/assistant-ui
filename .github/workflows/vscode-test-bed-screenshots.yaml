name: VS Code Test Bed Screenshots

on:
  pull_request:
    paths:
      - .github/workflows/vscode-test-bed-screenshots.yaml
      - examples/with-vscode/**
      - packages/ui/**
      - packages/vscode/**
      - templates/vscode/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/vscode-test-bed-screenshots.yaml
      - examples/with-vscode/**
      - packages/ui/**
      - packages/vscode/**
      - templates/vscode/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with vscode-test-bed.yaml.
  AUI_TESTBED_VSCODE_VERSION: 1.140.0

jobs:
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install VS Code system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm turbo build --filter='with-vscode^...'

      - name: Cache VS Code
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: examples/with-vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ env.AUI_TESTBED_VSCODE_VERSION }}

      - name: Take screenshots in VS Code
        run: xvfb-run -a pnpm --filter with-vscode screenshots

      - name: Upload screenshots
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: vscode-test-bed-screenshots
          path: examples/with-vscode/screenshots/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 14 }}
          if-no-files-found: warn

      - name: Link the contact sheet
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "Download [vscode-test-bed-screenshots]($ARTIFACT_URL), unzip it and open \`gallery/index.html\` for the contact sheet." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe report and VS Code logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: vscode-test-bed-screenshots-report
          path: examples/with-vscode/test-results/
          retention-days: 14
          if-no-files-found: warn
