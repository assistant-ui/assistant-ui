name: Test Coverage

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "examples/**"
      - "templates/**"
      - "evals/**"
      - "scripts/example-bundles.json"
      - "scripts/coverage-shards.mjs"
      - "scripts/coverage-shards.test.mjs"
      - "scripts/coverage-summary.mjs"
      - "scripts/coverage-summary.test.mjs"
      - "scripts/test-coverage-contract.test.mjs"
      - "scripts/lib/**"
      - "turbo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/test-coverage.yaml"
      - ".github/workflows/code-quality.yaml"
  # Pull requests and merge groups always start a run, because a required check that never reports blocks the merge; the job skips its own steps when no coverage input changed.
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan coverage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.inputs.outputs.run }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}

      - name: Detect coverage inputs
        id: inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=HEAD^1
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE=""
          fi
          run=true
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "${BASE}^{commit}" > /dev/null && git diff --quiet "$BASE" HEAD -- \
            packages \
            apps \
            examples \
            templates \
            evals \
            scripts/example-bundles.json \
            scripts/coverage-shards.mjs \
            scripts/coverage-shards.test.mjs \
            scripts/coverage-summary.mjs \
            scripts/coverage-summary.test.mjs \
            scripts/test-coverage-contract.test.mjs \
            scripts/lib \
            turbo.json \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            .github/workflows/test-coverage.yaml \
            .github/workflows/code-quality.yaml; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  shards:
    name: Coverage shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # assistant-stream's resumable store and apps/docs need a live Redis, or their Redis suites skip and miss their coverage thresholds.
    services:
      redis:
        image: redis:8-alpine # ratchet:exclude
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-start-period 10s
          --health-start-interval 1s
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Setup pnpm and node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # ratchet:pnpm/setup@v3.1.2
        with:
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test coverage routing and summary
        if: matrix.shard == 0
        run: node --test scripts/test-coverage-contract.test.mjs scripts/coverage-summary.test.mjs scripts/coverage-shards.test.mjs

      # Each vitest run already spreads its files across every core, so prebuild its prerequisites at turbo's default concurrency before coverage limits concurrency to two.
      - name: Build packages
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: node scripts/coverage-shards.mjs "${{ matrix.shard }}" --build

      - name: Run React Compiler tests
        if: matrix.shard == 0
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: pnpm test:react-compiler

      - name: Run assigned packages with coverage
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: |
          filters=$(node scripts/coverage-shards.mjs "${{ matrix.shard }}")
          mapfile -t args <<< "$filters"
          pnpm test:coverage --continue "${args[@]}"

      - name: Write the coverage summary
        if: always()
        run: pnpm coverage:summary --report "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: |
            packages/*/coverage/
            apps/*/coverage/
            examples/*/coverage/
            templates/*/coverage/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Test Coverage
    needs: [plan, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify coverage jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          SHARD_RESULT: ${{ needs.shards.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$RUN" = true ]; then
            test "$SHARD_RESULT" = success
          else
            test "$RUN" = false
            test "$SHARD_RESULT" = skipped
          fi

      - name: Checkout summary script
        if: needs.plan.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Download coverage reports
        if: needs.plan.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Write combined coverage summary
        if: needs.plan.outputs.run == 'true'
        run: node scripts/coverage-summary.mjs --report "$GITHUB_STEP_SUMMARY"
