name: CI single test pass benchmark
on:
  push:
    branches: [perf/ci-single-test-pass-bench]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        sample: [0, 1, 2]
    services:
      redis:
        image: redis:8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: false
          install: false
      - run: git fetch --depth=1 origin 592f5013eabba61bc454eec31719f4a4e12cbc54
      - run: pnpm install --frozen-lockfile
      - name: Compare duplicate and consolidated execution
        run: node scripts/ci-single-test-pass-bench.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-single-test-pass-${{ matrix.sample }}
          path: bench-results/
          retention-days: 14
