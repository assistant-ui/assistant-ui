name: CI follow-up benchmark
on:
  push:
    branches: [perf/ci-followup-bench]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        example: [with-react-ink-web]
        variant: [full-cached, scoped-uncached]
        sample: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: ${{ matrix.variant != 'scoped-uncached' }}
          install: false
      - name: Measure install and verify build
        env:
          EXAMPLE: ${{ matrix.example }}
          VARIANT: ${{ matrix.variant }}
          EXPO_PUBLIC_CHAT_ENDPOINT_URL: https://www.assistant-ui.com/api/chat
        run: node scripts/ci-followup-bench.mjs install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: install-${{ matrix.example }}-${{ matrix.variant }}-${{ matrix.sample }}
          path: bench-results/
          retention-days: 7
  tests:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sample: [0, 1, 2]
    services:
      redis:
        image: redis:8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Measure serial and bounded-parallel tests
        run: node scripts/ci-followup-bench.mjs tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tests-${{ matrix.sample }}
          path: bench-results/
          retention-days: 7
