name: React 18 Peer Tests

# Packages whose react peer range is ^18 || ^19 run React 19 on every PR; React 18 runs here, weekly and on demand.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: "turbo filter arguments, e.g. --filter=@assistant-ui/react (default: every package with React 18 scripts)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react18:
    name: React 18
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # ratchet:pnpm/setup@v3.1.2
        with:
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check published declarations against React 18
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          PACKAGES: ${{ inputs.packages }}
        # PACKAGES is split on purpose, so it can carry several --filter arguments.
        run: pnpm turbo run test:types:peer-react18 --continue $PACKAGES

      # Each vitest run already spreads its files across every core, so parallel test tasks oversubscribe this runner; the builds above keep turbo's default concurrency.
      - name: Run tests on React 18
        if: ${{ !cancelled() }}
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          PACKAGES: ${{ inputs.packages }}
        run: pnpm turbo run test:peer-react18 --concurrency=1 --continue $PACKAGES

  report:
    name: Report
    needs: react18
    # Only scheduled runs report, so a dispatch against a work-in-progress branch never opens or closes the issue.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure-issue.yaml
    with:
      title: React 18 peer tests are failing
      failed: ${{ needs.react18.result != 'success' }}
