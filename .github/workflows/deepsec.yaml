name: DeepSec

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: deepsec-${{ (github.event.action != 'edited' || github.event.changes.base) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review changed files
    if: >-
      vars.DEEPSEC_ENABLED == 'true' &&
      (github.event.action != 'edited' || github.event.changes.base) &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deepsec
    outputs:
      report: ${{ steps.review.outputs.outcome == 'finding' && steps.upload.outputs.artifact-id || '' }}
      report-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Prepare source from the PR commits
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ancestor=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD?per_page=1" --jq .merge_base_commit.sha)
          git -c 'credential.helper=!gh auth git-credential' fetch --quiet --no-tags --depth=1 origin "$ancestor" "$HEAD"
          python3 scripts/deepsec_review.py prepare "$ancestor" "$HEAD" "$RUNNER_TEMP"
          if [[ -s "$RUNNER_TEMP/files.txt" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          sed -n '/^-----BEGIN PGP PUBLIC KEY BLOCK-----$/,/^-----END PGP PUBLIC KEY BLOCK-----$/p' SECURITY.md > "$RUNNER_TEMP/security-team.asc"

      - name: Install DeepSec outside the checkout
        if: steps.source.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --prefix ./deepsec --omit=optional --ignore-scripts --no-audit --no-fund deepsec@2.3.16

      - name: Review the pull request
        if: steps.source.outputs.changed == 'true'
        id: review
        working-directory: ${{ runner.temp }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.DEEPSEC_GATEWAY_KEY }}
        run: python3 "$GITHUB_WORKSPACE/scripts/deepsec_review.py" review

      - name: Save encrypted report or diagnostics
        if: "!cancelled() && steps.review.outputs.file != ''"
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: deepsec-review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.review.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  triage:
    name: Security triage
    needs: review
    if: needs.review.outputs.report != ''
    environment:
      name: deepsec-triage
      url: ${{ needs.review.outputs.report-url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Verify approval for this report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ID: ${{ needs.review.outputs.report }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg id "$REPORT_ID" 'any(.[]; .state == "approved" and .comment == $id and any(.environments[]; .name == "deepsec-triage"))' >/dev/null || {
              echo "::error::The security team must approve this report with its artifact ID in the deployment review."
              exit 1
            }
