name: DeepSec

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: deepsec-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review changed files
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install DeepSec outside the checkout
        working-directory: ${{ runner.temp }}
        run: npm install --prefix ./deepsec --omit=optional --ignore-scripts --no-audit --no-fund deepsec@2.3.16

      - name: Review the pull request
        id: review
        working-directory: ${{ runner.temp }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.DEEPSEC_GATEWAY_KEY }}
        run: |
          : "${AI_GATEWAY_API_KEY:?Set the DEEPSEC_GATEWAY_KEY Actions secret to enable reviews.}"
          if ./deepsec/node_modules/.bin/deepsec process --agent pi \
            --root "$GITHUB_WORKSPACE" --diff 'HEAD^1..HEAD' \
            --comment-out review.md > /dev/null 2>&1; then
            exit 0
          fi
          if [[ ! -s review.md ]]; then
            echo "::error::DeepSec could not complete the review. Check the gateway key and its spending limit, then rerun the job."
            exit 1
          fi

          git -C "$GITHUB_WORKSPACE" show HEAD^1:SECURITY.md |
            sed -n '/^-----BEGIN PGP PUBLIC KEY BLOCK-----$/,/^-----END PGP PUBLIC KEY BLOCK-----$/p' > security-team.asc
          gpg --batch --recipient-file security-team.asc --output review.md.gpg --encrypt review.md
          echo "findings=true" >> "$GITHUB_OUTPUT"
          echo "::error::The security team can inspect the encrypted deepsec-review artifact from this run."
          exit 1

      - name: Save encrypted review for the security team
        if: failure() && steps.review.outputs.findings == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: deepsec-review
          path: ${{ runner.temp }}/review.md.gpg
          if-no-files-found: error
          retention-days: 7
