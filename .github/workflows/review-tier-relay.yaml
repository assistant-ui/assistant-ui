name: Review Tier Relay

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    name: Relay review event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p review-tier-pr
          printf '%s\n' "$PR_NUMBER" > review-tier-pr/number

      - name: Upload the pull request number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: review-tier-pr
          path: review-tier-pr/
          retention-days: 1
