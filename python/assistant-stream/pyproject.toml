[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistant-stream"
version = "0.0.37"
description = ""
authors = [
  { name="Simon Farshid", email="simon@assistant-ui.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anyio>=3.4.0",
    "starlette>=0.37.2",
]

[project.optional-dependencies]
langgraph = ["langchain-core>=0.3.0"]
redis = ["redis>=5"]
pydantic-ai = ["pydantic-ai-slim[ag-ui]>=2.61.0; python_version >= '3.11'"]
postgres = ["psycopg[binary,pool]>=3.2"]
dev = ["pytest<8", "redis>=5", "httpx>=0.27", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/assistant-ui/assistant-ui"
Issues = "https://github.com/assistant-ui/assistant-ui/issues"
