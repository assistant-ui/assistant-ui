packages:
  - api-surface
  - packages/*
  - examples/*
  - apps/*
  - templates/*

linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - '@types/*'

strictDepBuilds: true

verifyDepsBeforeRun: install

# Metro, Expo and React Native run Babel 7. A Babel 8 copy of these packages lands where react-native-worklets 0.10 requires them undeclared and breaks native bundles, and babel-plugin-react-compiler 1.0 fails under @babel/core 8. taze reads this list too.
update:
  ignoreDeps:
    - '@babel/core'
    - '@babel/generator'
    - '@babel/parser'
    - '@babel/traverse'
    - '@babel/types'

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@assistant-ui/*'
  - '@next/*'
  - '@openuidev/assistant-ui'
  - '@typescript/typescript-*'
  - assistant-cloud
  - assistant-stream
  - assistant-ui
  - aui-auth
  - create-assistant-ui
  - eve
  - heat-graph
  - next
  - safe-content-frame
  - tw-shimmer
  - typescript

allowBuilds:
  '@clerk/shared': false
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@openuidev/lang-core': false
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  core-js: false
  esbuild@0.27.0: true
  esbuild@0.28.1: true
  esbuild@0.28.2: true
  node-liblzma: false
  protobufjs: false
  react-grab: false
  vue-demi: false

overrides:
  '@opentelemetry/core@>=2 <3': 2.10.0
  '@vercel/fun>@tootallnate/once': 2.0.1
  '@vercel/static-config>ajv': 8.20.0
  '@vercel/python-analysis>js-yaml': 4.3.2
  '@vercel/python-analysis>minimatch': 10.2.6
  '@vercel/fun>path-to-regexp': 8.4.2
  '@vercel/backends>path-to-regexp': 8.4.2
  '@vercel/express>path-to-regexp': 8.4.2
  '@vercel/hono>path-to-regexp': 8.4.2
  '@vercel/python-analysis>smol-toml': 1.8.0
  '@vercel/rust>smol-toml': 1.8.0
  'vercel>smol-toml': 1.8.0
  '@vercel/fun>tar': 7.5.22
  '@vercel/node>undici': 5.29.0
