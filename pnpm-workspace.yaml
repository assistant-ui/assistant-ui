packages:
  - api-surface
  - packages/*
  - examples/*
  - apps/*
  - templates/*

linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - '@types/*'

peerDependencyRules:
  allowedVersions:
    '@openuidev/react-headless@0.9.5>zustand': '^5.0.14'
    '@openuidev/react-ui@0.13.4>zustand': '^5.0.14'

strictDepBuilds: true

verifyDepsBeforeRun: install

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@assistant-ui/*'
  - '@next/*'
  - '@typescript/typescript-*'
  - assistant-cloud
  - assistant-stream
  - assistant-ui
  - create-assistant-ui
  - eve
  - heat-graph
  - next
  - safe-content-frame
  - tw-glass
  - tw-shimmer
  - typescript

allowBuilds:
  '@clerk/shared': false
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@openuidev/lang-core': false
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  core-js: false
  esbuild@0.28.1: true
  node-liblzma: false
  protobufjs: false
  react-grab: false
  sqlite3@5.1.7: true
