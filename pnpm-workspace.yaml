packages:
  - api-surface
  - evals
  - packages/*
  - examples/*
  - apps/*
  - templates/*

linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - '@types/*'

strictDepBuilds: true

overrides:
  '@google/adk>adm-zip': ^0.6.1
  '@vercel/container>tar': ^7.5.22
  # @lhci/cli 0.15.1, the latest release, bundles Lighthouse 12.6.1, which returned no performance score (NO_LCP) on current Chrome.
  lighthouse: ^13.5.0
  '@earendil-works/pi-coding-agent>undici': ^8.12.2
  guarded-fetch>undici: ^7.30.1
  miniflare>undici: ^7.30.1

verifyDepsBeforeRun: install

# Metro, Expo and React Native run Babel 7. A Babel 8 copy of these packages lands where react-native-worklets 0.10 requires them undeclared and breaks native bundles, and babel-plugin-react-compiler 1.0 fails under @babel/core 8. taze reads this list too.
update:
  ignoreDeps:
    - '@babel/core'
    - '@babel/generator'
    - '@babel/parser'
    - '@babel/traverse'
    - '@babel/types'

# Release age is a verification gate: review fresh releases, then add narrowly scoped, exact-version exceptions when justified.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@farming-labs/docs@0.2.127'
  - '@farming-labs/theme@0.2.127'
  - '@lexical/a11y@0.53.0'
  - '@lexical/clipboard@0.53.0'
  - '@lexical/code-core@0.53.0'
  - '@lexical/devtools-core@0.53.0'
  - '@lexical/dragon@0.53.0'
  - '@lexical/extension@0.53.0'
  - '@lexical/hashtag@0.53.0'
  - '@lexical/history@0.53.0'
  - '@lexical/html@0.53.0'
  - '@lexical/internal@0.53.0'
  - '@lexical/link@0.53.0'
  - '@lexical/list@0.53.0'
  - '@lexical/mark@0.53.0'
  - '@lexical/markdown@0.53.0'
  - '@lexical/overflow@0.53.0'
  - '@lexical/plain-text@0.53.0'
  - '@lexical/react@0.53.0'
  - '@lexical/rich-text@0.53.0'
  - '@lexical/selection@0.53.0'
  - '@lexical/table@0.53.0'
  - '@lexical/text@0.53.0'
  - '@lexical/utils@0.53.0'
  - '@lexical/yjs@0.53.0'
  - 'lexical@0.53.0'
  - '@assistant-ui/*'
  - '@next/*'
  - '@openuidev/assistant-ui'
  - '@typescript/typescript-*'
  - assistant-cloud
  - assistant-stream
  - assistant-ui
  - aui-auth
  - create-assistant-ui
  - eve
  - heat-graph
  - next
  - safe-content-frame
  - tw-shimmer
  - typescript

allowBuilds:
  '@clerk/shared': false
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@openuidev/lang-core': false
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  core-js: false
  core-js-pure: false
  cpu-features: false
  esbuild@0.27.0: true
  esbuild@0.28.2: true
  node-liblzma: false
  protobufjs: false
  react-grab: false
  ssh2: false
  vue-demi: false
  workerd@1.20261019.1: true
